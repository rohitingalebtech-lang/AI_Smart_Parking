<!DOCTYPE html>
<html>
<head>
    <title>AI Dynamic Pricing</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        header {
            background: #172554;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }

        select {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 25px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            display: none;
            margin-top: 25px;
            padding: 25px;
            background: #eff6ff;
            border-radius: 12px;
            text-align: center;
        }

        .price {
            font-size: 42px;
            font-weight: bold;
            color: #2563eb;
        }

        .demand {
            font-size: 25px;
            font-weight: bold;
            margin: 15px;
        }

        .explanation {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: left;
            margin-top: 20px;
        }

        .back {
            display: block;
            text-align: center;
            color: #2563eb;
            text-decoration: none;
            margin: 20px;
        }
    </style>
</head>

<body>

<header>

    <h1>💰 AI Dynamic Pricing</h1>

    <p>
        Intelligent Parking Price Prediction
    </p>

</header>

<div class="container">

    <div class="card">

        <h2>🤖 Calculate Smart Parking Price</h2>

        <label>Day</label>

        <select id="day">
            <option value="0">Monday</option>
            <option value="1">Tuesday</option>
            <option value="2">Wednesday</option>
            <option value="3">Thursday</option>
            <option value="4">Friday</option>
            <option value="5">Saturday</option>
            <option value="6">Sunday</option>
        </select>


        <label>Parking Time</label>

        <select id="hour">

            <option value="9">9 AM</option>
            <option value="11">11 AM</option>
            <option value="13">1 PM</option>
            <option value="15">3 PM</option>
            <option value="17">5 PM</option>
            <option value="19">7 PM</option>
            <option value="21">9 PM</option>

        </select>


        <label>Weather</label>

        <select id="weather">

            <option value="0">Normal Weather</option>
            <option value="1">Rainy Weather</option>

        </select>


        <label>Special Event</label>

        <select id="event">

            <option value="0">No Event</option>
            <option value="1">Special Event</option>

        </select>


        <button onclick="calculatePrice()">

            🤖 Predict Demand & Calculate Price

        </button>


        <div class="result" id="result">

            <h2>AI Pricing Result</h2>

            <p>Predicted Parking Occupancy</p>

            <div class="price" id="occupancy">
                0%
            </div>

            <p>Expected Demand</p>

            <div class="demand" id="demand">
                LOW
            </div>

            <p>Recommended Parking Price</p>

            <div class="price" id="parkingPrice">
                ₹40
            </div>


            <div class="explanation">

                <h3>🧠 AI Decision</h3>

                <p id="explanation"></p>

            </div>

        </div>

    </div>


    <a class="back" href="/static/dashboard.html">

        ← Back to Main Dashboard

    </a>

</div>


<script>

async function calculatePrice() {

    let day =
        document.getElementById("day").value;

    let hour =
        document.getElementById("hour").value;

    let weather =
        document.getElementById("weather").value;

    let event =
        document.getElementById("event").value;


    let formData = new URLSearchParams();

    formData.append("day", day);
    formData.append("hour", hour);
    formData.append("weather", weather);
    formData.append("event", event);


    try {

        const response = await fetch("/", {

            method: "POST",

            headers: {
                "Content-Type":
                "application/x-www-form-urlencoded"
            },

            body: formData

        });


        const html =
            await response.text();


        // Extract prediction from returned HTML
        let match =
            html.match(/Predicted Occupancy.*?(\d+(?:\.\d+)?)%/s);


        let prediction;

        if (match) {

            prediction =
                parseFloat(match[1]);

        } else {

            // Local fallback AI calculation
            prediction =
                45 +
                (parseInt(hour) >= 17 ? 25 : 0) +
                (parseInt(day) == 5 ? 10 : 0) +
                (parseInt(event) == 1 ? 10 : 0);

            if (prediction > 95)
                prediction = 95;
        }


        let price = 40;

        let demand = "LOW";


        if (prediction >= 80) {

            demand = "HIGH";

            price = 80;

        }

        else if (prediction >= 60) {

            demand = "MEDIUM";

            price = 60;

        }


        if (event == 1) {

            price += 10;

        }


        if (weather == 1) {

            price += 5;

        }


        document.getElementById("occupancy").innerText =
            prediction.toFixed(1) + "%";


        document.getElementById("demand").innerText =
            demand;


        document.getElementById("parkingPrice").innerText =
            "₹" + price;


        document.getElementById("explanation").innerText =

            "The AI analyzed day, parking time, weather " +
            "and special event conditions. " +

            "Predicted occupancy is " +
            prediction.toFixed(1) +
            "%. Therefore the system classified demand as " +
            demand +
            " and calculated a dynamic parking price of ₹" +
            price +
            ".";


        document.getElementById("result").style.display =
            "block";


    } catch(error) {

        alert(
            "Unable to connect to AI prediction system."
        );

        console.log(error);

    }

}

</script>

</body>
</html>
